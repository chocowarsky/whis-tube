[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "whis-tube"
version = "1.1.0"
description = "High-fidelity YouTube verbatim transcription & visual frame extraction MCP server"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "chocowarsky", email = "bagus27wijaya@gmail.com" }
]
keywords = [
    "mcp",
    "mcp-server",
    "youtube",
    "whisper",
    "transcription",
    "groq",
    "ffmpeg",
    "yt-dlp",
    "ai-agents",
    "claude-code",
    "cursor"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "mcp[cli]>=1.0.0",
    "yt-dlp>=2025.1.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
youtube-whisper = "whis_tube.server:main"
whis-tube = "whis_tube.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/whis_tube"]

[tool.ruff]
target-version = "py310"
line-length = 110

[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
